name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: Test Suite
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all crates
        run: cargo build --all-features --all-targets

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Build binaries
        run: |
          cargo build --release -p saorsa-coordinator
          cargo build --release -p saorsa-gossip

      - name: Test binaries
        run: |
          cargo test -p saorsa-coordinator
          cargo test -p saorsa-gossip

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Check MSRV
        run: cargo check --all-features --all-targets


  leaf-protocol-isolation:
    # #504: dedicated hash-bound Linux fence for the ignored Leaf-protocol
    # proof (leaf_shed_normal_recovers_exact_message_via_ihave_iwant). The
    # four x0x harness helpers are NOT SG source: scripts/ci/stage-x0x-isolation.py
    # retrieves them from one pinned upstream commit, verifies each SHA-256
    # before anything is executed, and keeps provenance in RUNNER_TEMP.
    # Exactly ONE acceptance wrapper invocation: the custody collector
    # rejects a second build-custody scratch (SCRATCH_COUNT).
    name: Leaf Protocol Isolated Acceptance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Assert checkout matches event SHA
        # Default checkout resolves the PR merge ref; GITHUB_SHA is that same
        # commit. The wrapper's custody must be bound to the actual event SHA,
        # never to a faked PR head.
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::checkout HEAD ${head} != GITHUB_SHA ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-leaf504-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-leaf504-cargo-registry-

      - name: Cache cargo git database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-leaf504-cargo-git-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-leaf504-cargo-git-

      - name: Stage hash-pinned x0x isolation helpers
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 scripts/ci/stage-x0x-isolation.py

      - name: Resolve dependency graph
        # Cargo.lock is intentionally gitignored in SG; generate it once so
        # the audited wrapper can hash it and run its locked build.
        run: cargo generate-lockfile

      - name: Verify staged tree custody
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 scripts/ci/stage-x0x-isolation.py --verify-tree

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-leaf504-target-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144  # exact pin, same as the audited x0x harness commit

      - name: Run isolated Leaf protocol acceptance
        id: leaf_acceptance
        env:
          X0X_ISOLATION_ROLE: acceptance
          X0X_RUNTIME_TIMEOUT_SECONDS: 180
        run: |
          bash scripts/ci/nextest-isolated.sh --manifest-path crates/pubsub/Cargo.toml \
            --all-features --test multi_node_publish -- \
            --run-ignored ignored-only --no-tests=fail --test-threads 1 \
            -E 'test(=leaf_shed_normal_recovers_exact_message_via_ihave_iwant)'

      - name: Collect isolation custody
        if: always()
        id: collect_custody
        env:
          X0X_CUSTODY_EXPECT: ${{ steps.leaf_acceptance.outcome }}
          X0X_CUSTODY_TARGET: multi_node_publish
          X0X_CUSTODY_ROLES: acceptance
          X0X_CUSTODY_MIN_RUNS: '1'
        run: python3 scripts/ci/isolation-custody-collect.py "${RUNNER_TEMP}/sg-504-custody"

      - name: Upload isolation custody receipt
        if: always() && steps.collect_custody.outputs.receipt_eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sg-504-isolation-custody
          path: ${{ runner.temp }}/sg-504-custody/custody-receipt.json
          if-no-files-found: error

      - name: Upload staged harness provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-504-harness-provenance
          path: ${{ runner.temp }}/sg-504-harness-provenance/manifest.json
          if-no-files-found: error
