[package]
name = "saorsa-gossip-pubsub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pub/sub for Saorsa Gossip: Plumtree epidemic broadcast with EAGER/IHAVE/IWANT"
keywords = ["p2p", "gossip", "pubsub", "plumtree", "broadcast"]
categories = ["network-programming"]

[dependencies]
saorsa-gossip-types = { workspace = true }
saorsa-gossip-transport = { workspace = true }
saorsa-gossip-membership = { workspace = true }
saorsa-gossip-identity = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
bytes = { version = "1.5", features = ["serde"] }
anyhow = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
lru = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
saorsa-gossip-workspace-hack = { version = "0.1", path = "../../saorsa-gossip-workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Exact published legacy parser and handlers for ADR-013 compatibility witnesses.
legacy-pubsub = { package = "saorsa-gossip-pubsub", version = "=0.5.66" }
legacy-types = { package = "saorsa-gossip-types", version = "=0.5.66" }
legacy-transport = { package = "saorsa-gossip-transport", version = "=0.5.66" }
legacy-identity = { package = "saorsa-gossip-identity", version = "=0.5.66" }
serde_json = { workspace = true }
proptest = { workspace = true }
tokio-test = { workspace = true }
tempfile = "3"
saorsa-gossip-transport = { workspace = true, features = ["test-helpers"] }
criterion = { workspace = true }

[[bench]]
name = "peer_scoring_contention"
harness = false

[lints]
workspace = true
